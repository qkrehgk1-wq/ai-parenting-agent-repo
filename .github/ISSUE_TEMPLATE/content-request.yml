name: Content Request
description: 육아 콘텐츠 또는 가이드 제작 요청
title: "[콘텐츠] "
labels:
  - type:content
body:
  - type: textarea
    id: problem
    attributes:
      label: 문제 상황
      description: 부모가 어떤 상황에서 이 질문을 하게 되는지 적어주세요.
      placeholder: 예) 28개월 아이가 밥을 잘 안 먹고, 식사 시간이 길어져 부모가 스트레스를 많이 받는 상황
    validations:
      required: true

  - type: input
    id: target_parent
    attributes:
      label: 타깃 부모
      placeholder: 예) 24~36개월 아이를 둔 맞벌이 부모
    validations:
      required: true

  - type: input
    id: child_age
    attributes:
      label: 아이 연령
      placeholder: 예) 28개월

  - type: dropdown
    id: category
    attributes:
      label: 카테고리
      options:
        - 수면
        - 식사
        - 놀이
        - 발달
        - 감정 코칭
        - 교육
        - 제품 추천
        - 부모 습관
    validations:
      required: true

  - type: checkboxes
    id: outputs
    attributes:
      label: 원하는 결과물
      options:
        - label: 블로그 글
        - label: 카드뉴스 문안
        - label: 뉴스레터 요약
        - label: 쇼츠 스크립트

  - type: dropdown
    id: sensitivity
    attributes:
      label: 민감도
      options:
        - 일반
        - 주의
        - 의료 민감
    validations:
      required: true

  - type: textarea
    id: done_criteria
    attributes:
      label: 완료 기준
      value: |
        - 근거 자료 3개 이상 반영
        - 안전 검수 통과
        - 채널별 배포문 생성 완료
    validations:
      required: true
